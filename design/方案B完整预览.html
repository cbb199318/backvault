<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案B完整预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --blue:#3370ff; --blue-h:#2b5fe0; --blue-50:#eef4ff; --blue-100:#dce7ff;
    --green:#18a058; --green-50:#e8f7ee;
    --orange:#f08a24; --orange-50:#fff3e6;
    --red:#e5484d; --red-50:#fdecec;
    --purple:#7b61ff; --purple-50:#f1ecff;
    --t1:#1f2329; --t2:#4e5969; --t3:#86909c; --t4:#c0c6cf;
    --line:#eef0f3; --line2:#e5e6eb; --bg:#f2f4f7;
  }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#dfe3e9; color:var(--t1); font-size:14px; }
  button { font-family:inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  .sp { flex:1; }
  a { color:var(--blue); cursor:pointer; text-decoration:none; }

  /* ===== 预览跳转条（不属于应用 UI） ===== */
  .jump { position:sticky; top:0; z-index:200; background:#1f2937; color:#cbd5e1; padding:8px 16px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; }
  .jump b { color:#fff; font-size:13px; margin-right:6px; }
  .jump .g { color:#6b7280; margin:0 4px 0 10px; }
  .jump button { background:rgba(255,255,255,.08); color:#e5e7eb; border:1px solid rgba(255,255,255,.18); border-radius:5px; padding:4px 10px; cursor:pointer; font-size:12px; }
  .jump button:hover { background:var(--blue); border-color:var(--blue); }

  /* ===== 窗口 ===== */
  .win { max-width:1320px; margin:16px auto 40px; border-radius:12px; overflow:hidden; box-shadow:0 12px 40px rgba(15,23,42,.18); background:var(--bg); position:relative; }
  .win-bar { height:40px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px; gap:10px; font-size:13px; color:var(--t2); }
  .win-bar .logo { width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,#5b8cff,#3370ff); display:flex; align-items:center; justify-content:center; color:#fff; }
  .win-bar .ctrl { margin-left:auto; display:flex; gap:14px; color:var(--t3); }
  .app { display:flex; height:820px; }
  .side { width:200px; flex:none; background:#fff; border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; }
  .nav { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--t2); cursor:pointer; margin-bottom:2px; user-select:none; }
  .nav:hover { background:#f5f7fa; }
  .nav.on { background:var(--blue-50); color:var(--blue); font-weight:500; }
  .nav svg { width:18px; height:18px; flex:none; }
  .nav .cnt { margin-left:auto; font-size:12px; color:var(--t3); font-weight:400; }
  .nav.on .cnt { color:var(--blue); }
  .nav .cnt.run { background:var(--blue); color:#fff; border-radius:9px; padding:0 6px; line-height:17px; }
  .side-foot { margin-top:auto; padding:10px 12px 2px; font-size:11px; color:var(--t4); line-height:1.8; }
  .main { flex:1; min-width:0; overflow:auto; padding:24px 32px 40px; }

  /* ===== 通用组件 ===== */
  .head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .head h1 { font-size:20px; font-weight:600; }
  .head .sub { font-size:13px; color:var(--t3); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 14px; border-radius:6px; font-size:13px; cursor:pointer; border:1px solid #dcdfe6; background:#fff; color:var(--t1); white-space:nowrap; }
  .btn:hover { border-color:var(--blue); color:var(--blue); }
  .btn svg { width:14px; height:14px; }
  .btn.pri { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn.pri:hover { background:var(--blue-h); color:#fff; }
  .btn.pri:disabled { background:#a9c1ff; border-color:#a9c1ff; cursor:not-allowed; }
  .btn.danger { color:var(--red); }
  .btn.danger:hover { border-color:var(--red); }
  .btn.danger-fill { background:var(--red); border-color:var(--red); color:#fff; }
  .btn.sm { height:28px; padding:0 10px; font-size:12px; }
  .btn.txt { border:none; background:transparent; color:var(--blue); padding:0 4px; height:auto; }
  .ib { width:30px; height:30px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; color:var(--t2); cursor:pointer; border:none; background:transparent; vertical-align:middle; }
  .ib:hover { background:#f2f3f5; color:var(--blue); }
  .ib svg { width:16px; height:16px; }
  .tag { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:4px; font-size:12px; white-space:nowrap; font-weight:400; }
  .tag.ok { background:var(--green-50); color:var(--green); }
  .tag.run { background:var(--blue-50); color:var(--blue); }
  .tag.warn { background:var(--orange-50); color:var(--orange); }
  .tag.err { background:var(--red-50); color:var(--red); }
  .tag.gray { background:#f2f3f5; color:var(--t2); }
  .tag.pur { background:var(--purple-50); color:var(--purple); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .bar { height:6px; background:var(--blue-100); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); border-radius:3px; position:relative; overflow:hidden; }
  .bar i::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); animation:sh 1.6s infinite; }
  @keyframes sh { from { transform:translateX(-100%); } to { transform:translateX(100%); } }
  .spin { width:11px; height:11px; border:2px solid var(--blue-100); border-top-color:var(--blue); border-radius:50%; animation:rot .9s linear infinite; display:inline-block; flex:none; }
  @keyframes rot { to { transform:rotate(360deg); } }
  .panel { background:#fff; border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .ph { display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line); }
  .ph h3 { font-size:15px; font-weight:600; }
  .seg { display:inline-flex; background:#f2f3f5; border-radius:6px; padding:2px; }
  .seg span { padding:3px 12px; border-radius:4px; font-size:12px; color:var(--t2); cursor:pointer; user-select:none; display:inline-flex; gap:4px; align-items:center; }
  .seg span.on { background:#fff; color:var(--t1); box-shadow:0 1px 2px rgba(0,0,0,.08); font-weight:500; }
  .seg.lg span { padding:5px 16px; font-size:13px; }
  .search { height:30px; width:200px; border:1px solid var(--line2); border-radius:6px; display:flex; align-items:center; gap:6px; padding:0 10px; color:var(--t4); font-size:12px; background:#fff; }
  .search svg { width:14px; height:14px; }
  .tbl { width:100%; border-collapse:collapse; }
  .tbl th { text-align:left; font-weight:400; font-size:12px; color:var(--t3); padding:9px 20px; background:#fafbfc; white-space:nowrap; }
  .tbl td { padding:13px 20px; border-top:1px solid var(--line); vertical-align:middle; font-size:13px; }
  .tbl tbody tr { cursor:pointer; }
  .tbl tbody tr:hover td { background:#f8faff; }
  .r { text-align:right; }
  .dim { color:var(--t3); }
  .ellip { max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { background:#f5f7fa; border-radius:4px; padding:2px 8px; white-space:nowrap; font-size:12px; color:var(--t2); }
  .empty { padding:48px 0; text-align:center; color:var(--t3); font-size:13px; }
  .empty b { display:block; color:var(--t2); font-size:14px; font-weight:500; margin-bottom:4px; }

  /* KPI 条 */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
  .kpi { background:#fff; border-radius:12px; padding:16px 18px; display:flex; align-items:center; gap:14px; }
  .kpi .ic { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .kpi .ic svg { width:20px; height:20px; }
  .kpi .k { font-size:12px; color:var(--t3); }
  .kpi .v { font-size:20px; font-weight:600; margin-top:2px; }
  .kpi .v small { font-size:12px; font-weight:400; color:var(--t3); margin-left:3px; }

  /* 备份任务 hero */
  .hero { background:linear-gradient(120deg,#ffffff 0%,#f4f8ff 60%,#e9f1ff 100%); border-radius:12px; padding:22px 26px; display:flex; align-items:center; gap:26px; margin-bottom:16px; position:relative; overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-60px; top:-60px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle, rgba(51,112,255,.10), transparent 70%); pointer-events:none; }
  .ring { width:96px; height:96px; flex:none; position:relative; }
  .ring > svg { width:96px; height:96px; transform:rotate(-90deg); }
  .ring .c { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--green); }
  .ring .c svg { width:30px; height:30px; }
  .hero h2 { font-size:20px; font-weight:600; }
  .hero p { font-size:13px; color:var(--t2); margin-top:6px; }
  .hero-kpis { margin-left:auto; display:flex; position:relative; z-index:1; }
  .hero-kpi { padding:0 26px; border-left:1px solid #dfe6f3; }
  .hero-kpi:first-child { border-left:none; }
  .hero-kpi .k { font-size:12px; color:var(--t3); }
  .hero-kpi .v { font-size:22px; font-weight:600; margin-top:4px; }
  .hero-kpi .v small { font-size:12px; font-weight:400; color:var(--t3); margin-left:2px; }
  .tname { display:flex; align-items:center; gap:12px; }
  .tname .ic { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .tname .ic svg { width:20px; height:20px; }
  .tname b { font-weight:500; display:block; }
  .tname small { font-size:12px; color:var(--t3); }
  .route { display:flex; align-items:center; gap:6px; }
  .route svg { color:var(--t4); }
  .spark { display:flex; gap:3px; align-items:flex-end; height:22px; }
  .spark i { width:6px; border-radius:2px; background:var(--green); opacity:.85; }
  .spark i.f { background:var(--red); } .spark i.w { background:var(--orange); } .spark i.n { background:#e5e6eb; }
  .mini { width:150px; }
  .mini .t { font-size:12px; color:var(--blue); margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; gap:4px; }

  /* 更多菜单 */
  .menu { position:absolute; z-index:60; background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(15,23,42,.14); padding:4px; min-width:140px; }
  .menu div { padding:7px 12px; border-radius:5px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .menu div:hover { background:#f5f7fa; }
  .menu div.red { color:var(--red); }
  .menu hr { border:none; border-top:1px solid var(--line); margin:4px 0; }
  .menu svg { width:14px; height:14px; color:var(--t3); }

  /* 快照 · 仓库 */
  .running-strip { background:#fff; border:1px solid var(--blue-100); border-radius:10px; padding:10px 16px; display:flex; align-items:center; gap:12px; margin-bottom:16px; font-size:13px; }
  .running-strip .bar { flex:1; max-width:320px; }
  .repo-h { display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; }
  .repo-h:hover { background:#fafbfd; }
  .repo-ic { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .repo-ic svg { width:22px; height:22px; }
  .repo-n { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .repo-p { color:var(--t3); margin-top:3px; }
  .repo-stats { display:flex; gap:28px; margin-left:auto; margin-right:10px; }
  .repo-stats div { text-align:right; }
  .repo-stats .k { font-size:12px; color:var(--t3); }
  .repo-stats .v { font-size:14px; font-weight:600; margin-top:2px; }
  .chev { color:var(--t3); transition:transform .15s; }
  .chev svg { width:16px; height:16px; }
  .open .chev { transform:rotate(90deg); }
  .grp-h { display:flex; align-items:center; gap:10px; padding:12px 20px 8px; border-top:1px solid var(--line); font-size:13px; }
  .grp-h b { font-weight:500; }
  .cdot { width:8px; height:8px; border-radius:50%; }
  .diff { display:inline-flex; gap:4px; }
  .diff span { font-size:11px; padding:0 5px; border-radius:3px; line-height:18px; }
  .diff .a { background:var(--green-50); color:var(--green); }
  .diff .m { background:var(--blue-50); color:var(--blue); }
  .diff .d { background:var(--red-50); color:var(--red); }
  .diff .z { background:#f2f3f5; color:var(--t3); }
  .repo-foot { display:flex; align-items:center; padding:10px 20px; border-top:1px solid var(--line); font-size:12px; color:var(--t3); background:#fafbfc; }

  /* 面包屑 */
  .crumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--t3); margin-bottom:14px; }
  .crumb a { color:var(--t2); }
  .crumb a:hover { color:var(--blue); }
  .crumb b { color:var(--t1); font-weight:500; }

  /* 快照详情 */
  .sd-hero { background:#fff; border-radius:12px; padding:20px 24px; margin-bottom:16px; display:flex; align-items:center; gap:18px; }
  .sd-hero .ic { width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg,#8a7bff,#7b61ff); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(123,97,255,.28); flex:none; }
  .sd-hero .ic svg { width:26px; height:26px; }
  .sd-hero h2 { font-size:18px; font-weight:600; display:flex; align-items:center; gap:10px; }
  .sd-hero p { font-size:12px; color:var(--t3); margin-top:5px; display:flex; gap:14px; }
  .sd-kv { display:flex; margin-left:auto; }
  .sd-kv div { padding:0 22px; border-left:1px solid var(--line); }
  .sd-kv div:first-child { border-left:none; }
  .sd-kv .k { font-size:12px; color:var(--t3); }
  .sd-kv .v { font-size:16px; font-weight:600; margin-top:3px; }
  .fpath { display:flex; align-items:center; gap:4px; font-size:13px; flex-wrap:wrap; }
  .fpath a { color:var(--t2); padding:2px 4px; border-radius:4px; }
  .fpath a:hover { background:#f2f3f5; color:var(--blue); }
  .fpath a.cur { color:var(--t1); font-weight:500; }
  .fpath .sl { color:var(--t4); }
  .cbx { width:16px; height:16px; border-radius:4px; border:1.5px solid #c9cdd4; display:inline-flex; align-items:center; justify-content:center; flex:none; cursor:pointer; background:#fff; vertical-align:middle; }
  .cbx.on { background:var(--blue); border-color:var(--blue); }
  .cbx.on::after { content:""; width:8px; height:4px; border:2px solid #fff; border-top:none; border-right:none; transform:rotate(-45deg) translate(1px,-1px); }
  .cbx.half { background:var(--blue); border-color:var(--blue); }
  .cbx.half::after { content:""; width:8px; height:2px; background:#fff; border-radius:1px; }
  .fname { display:flex; align-items:center; gap:10px; }
  .fname svg { flex:none; }
  .selbar { position:sticky; bottom:0; display:flex; align-items:center; gap:12px; padding:12px 20px; background:#fff; border-top:1px solid var(--line); box-shadow:0 -4px 12px rgba(15,23,42,.04); }
  .selbar .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .selbar .chips span { background:var(--blue-50); color:var(--blue); border-radius:4px; padding:2px 8px; font-size:12px; display:inline-flex; gap:6px; align-items:center; }
  .selbar .chips i { font-style:normal; cursor:pointer; opacity:.7; }

  /* 还原向导 */
  .stepper { display:flex; align-items:center; padding:20px 40px; background:#fff; border-radius:12px; margin-bottom:16px; }
  .st { display:flex; align-items:center; gap:10px; flex:none; }
  .st .n { width:28px; height:28px; border-radius:50%; background:#f2f3f5; color:var(--t3); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
  .st .l b { display:block; font-size:13px; font-weight:500; color:var(--t3); }
  .st .l small { font-size:12px; color:var(--t4); }
  .st.on .n { background:var(--blue); color:#fff; box-shadow:0 0 0 4px var(--blue-50); }
  .st.on .l b { color:var(--t1); }
  .st.done .n { background:var(--blue-50); color:var(--blue); }
  .st.done .l b { color:var(--t2); }
  .st.done .l small { color:var(--t3); }
  .st-line { flex:1; height:2px; background:#eef0f3; margin:0 14px; border-radius:1px; }
  .st-line.done { background:var(--blue); }
  .wz-body { background:#fff; border-radius:12px; padding:22px 26px; min-height:360px; }
  .wz-title { font-size:16px; font-weight:600; margin-bottom:4px; }
  .wz-hint { font-size:13px; color:var(--t3); margin-bottom:18px; }
  .wz-foot { display:flex; align-items:center; gap:10px; padding:16px 0 0; }
  .opt-list { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .opt { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--line2); border-radius:10px; cursor:pointer; transition:.15s; background:#fff; text-align:left; }
  .opt:hover { border-color:var(--blue); }
  .opt.on { border-color:var(--blue); background:#f7faff; box-shadow:0 0 0 3px var(--blue-50); }
  .opt .ic { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
  .opt .ic svg { width:20px; height:20px; }
  .opt b { display:block; font-weight:500; font-size:14px; }
  .opt small { font-size:12px; color:var(--t3); display:block; margin-top:3px; }
  .rd { width:16px; height:16px; border-radius:50%; border:1.5px solid #c9cdd4; flex:none; margin-left:auto; position:relative; }
  .on .rd { border-color:var(--blue); }
  .on .rd::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--blue); }
  .snap-tl { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .snap-tl .row { display:flex; align-items:center; gap:14px; padding:12px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .snap-tl .row:first-child { border-top:none; }
  .snap-tl .row:hover { background:#f8faff; }
  .snap-tl .row.on { background:var(--blue-50); }
  .snap-tl .t { font-weight:600; width:110px; }
  .pick-btn { display:flex; align-items:center; gap:14px; width:100%; padding:18px; border:1.5px dashed #c9d6f5; background:#f8faff; border-radius:10px; cursor:pointer; color:var(--blue); font-size:14px; text-align:left; }
  .pick-btn:hover { border-color:var(--blue); }
  .pick-btn .ic { width:40px; height:40px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; }
  .pick-btn small { display:block; color:var(--t3); font-size:12px; margin-top:2px; }
  .tray { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .tray span { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); border-radius:6px; padding:5px 10px; font-size:13px; }
  .tray i { font-style:normal; color:var(--t3); cursor:pointer; }
  .summary { margin-top:20px; background:#f7f8fa; border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:14px; font-size:13px; }
  .summary .node { background:#fff; border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:8px; }
  .summary .node.hi { background:var(--blue-50); color:var(--blue); font-weight:500; }
  .summary svg { color:var(--t4); }

  /* 表单 */
  .fld { display:block; margin-bottom:16px; }
  .fld > .lb { font-size:13px; color:var(--t2); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .fld > .lb em { font-style:normal; color:var(--t3); font-size:12px; }
  .inp { width:100%; height:34px; border:1px solid #dcdfe6; border-radius:6px; padding:0 11px; font-size:13px; color:var(--t1); background:#fff; display:flex; align-items:center; gap:8px; outline:none; font-family:inherit; }
  .inp:focus, .inp.focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-50); }
  .inp .ph { color:var(--t4); }
  .inp svg { width:15px; height:15px; color:var(--t3); flex:none; }
  textarea.inp { height:auto; padding:8px 11px; resize:vertical; line-height:1.6; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .inline { display:flex; gap:8px; align-items:center; }
  .chips-sel { display:flex; flex-wrap:wrap; gap:8px; }
  .chips-sel span { border:1px solid var(--line2); border-radius:6px; padding:5px 12px; font-size:13px; cursor:pointer; user-select:none; color:var(--t2); }

  .sel { position:relative; }

  .mask.drawer { justify-content:flex-end; align-items:stretch; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:#fff; border-radius:12px; width:520px; max-height:calc(100% - 40px); display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(15,23,42,.25); }
  .anim > .modal { animation:pop .18s; }
  @keyframes pop { from { transform:translateY(8px) scale(.98); opacity:0; } }
  .modal.w640 { width:640px; } .modal.w720 { width:720px; } .modal.w420 { width:420px; }
  .drawer .modal { border-radius:12px 0 0 12px; width:600px; max-height:none; }
  .drawer.anim .modal { animation:slide .2s; }
  @keyframes slide { from { transform:translateX(40px); opacity:0; } }

  .mh h3 { font-size:16px; font-weight:600; }

  .ctype { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }

  .ctype div.on { border-color:var(--blue); background:#f7faff; box-shadow:0 0 0 3px var(--blue-50); color:var(--blue); font-weight:500; }
  .ctype .lg { width:36px; height:36px; border-radius:10px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; color:#fff; }
  .ctype .lg svg { width:20px; height:20px; }

  .log-sum .k { font-size:12px; color:var(--t3); }
  .log-sum .v { font-size:15px; font-weight:600; margin-top:3px; }
  .tl { position:relative; padding-left:20px; }
  .tl::before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px; background:var(--line2); }
  .tl .e { position:relative; padding-bottom:14px; font-size:13px; }
  .tl .e:last-child { padding-bottom:0; }
  .tl .e::before { content:""; position:absolute; left:-20px; top:4px; width:9px; height:9px; border-radius:50%; background:#fff; border:2px solid var(--green); }

  .tl .e.w::before { border-color:var(--orange); }
  .tl .e.r::before { border-color:var(--red); }

        <div class="row2"><label class="fld"><div class="lb">用户名</div><input class="inp" placeholder="admin"></label><label class="fld"><div class="lb">密码</div><input class="inp" type="password" placeholder="••••••"></label></div>

        : `<div style="background:#f7f8fa;border-radius:10px;padding:18px;text-align:center"><div style="width:120px;height:120px;margin:0 auto 10px;background:repeating-linear-gradient(45deg,#e5e6eb 0 6px,#fff 6px 12px);border-radius:8px"></div><div style="font-size:13px">打开 ${types.find(x=>x[0]===S.cloudType)[1]} App 扫码授权</div><div class="note">授权信息仅保存在本机</div></div>`}
    </div>
    <div class="mf"><button class="btn" style="margin-right:auto" onclick="toast('连接成功，可用空间 1.8 TB')">测试连接</button><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="closeModal();toast('云盘已添加')">保存</button></div></div>`;
}
function mLog(m) {
  const t = T(m.task);
  return `<div class="modal">
    <div class="mh"><h3>运行日志</h3><span class="dim" style="font-size:13px">${t.name}</span><button class="ib" onclick="closeModal()">${ic('x')}</button></div>
    <div class="dir-crumb" style="gap:8px">${['今天 14:02','11-02 03:00','10-30 14:44','10-30 08:03'].map((x,i)=>`<span class="tag ${i===0?'run':'gray'}" style="cursor:pointer">${x}</span>`).join('')}<span class="sp"></span><a style="font-size:12px" onclick="go({nav:'hist'})">全部历史</a></div>
    <div class="mb">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">${stTag(t.state==='run'?'run':t.state)}<b>${t.state==='run'?'备份进行中':t.state==='ok'?'备份成功':'完成，有警告'}</b><span class="sp"></span><span class="dim num" style="font-size:12px">${t.state==='run'?'开始于 14:02 · 已用 18 分':t.last}</span></div>
      ${t.state==='run'?`<div class="bar" style="margin-bottom:16px"><i style="width:45%"></i></div>`:''}
      <div class="log-sum"><div><div class="k">已处理</div><div class="v num">128,402 项</div></div><div><div class="k">数据量</div><div class="v num">196.3 GB</div></div><div><div class="k">上传速度</div><div class="v num">18.6 MB/s</div></div></div>
      <div style="font-size:13px;font-weight:600;margin-bottom:10px">关键节点</div>
      <div class="tl">
        <div class="e"><i class="num">14:02:11</i>开始备份 · 手动触发</div>
        <div class="e"><i class="num">14:02:15</i>已连接仓库 天翼云盘 / 飞牛加密备份</div>
        <div class="e"><i class="num">14:03:40</i>扫描完成：281,186 项 / 433.5 GB</div>
        <div class="e w"><i class="num">14:11:02</i>网络波动，第 1 次重试成功</div>
        <div class="e b"><i class="num">14:20:05</i>上传中 45%，预计剩余 22 分钟</div>
      </div>
      <div style="display:flex;align-items:center;margin-top:20px"><b style="font-size:13px">原始日志</b><span class="sp"></span><a style="font-size:12px" onclick="toast('已复制')">复制</a></div>
      <div class="raw mono">open repository
lock repository
using parent snapshot a9f3c2e1
load index files
start scan on [/vol1/1000/相册 /vol1/1000/资料]
start backup on [/vol1/1000/相册 /vol1/1000/资料]
scan finished in 89.2s: 281186 files, 433.512 GiB
<span class="w">rclone: Post "https://…/upload": EOF, retrying (1/10)</span>
<span class="g">[18:03] 45.28%  128402 files 196.3 GiB, total 281186 files 433.5 GiB, 0 errors ETA 22:14</span></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">关闭</button>${t.state==='run'?`<button class="btn danger">${ic('stop',12)}停止备份</button>`:''}</div></div>`;
}
function mPick() {
  const ft = renderFileTable(S.fdir, true);
  return `<div class="modal w720">
    <div class="mh"><h3>选择要还原的内容</h3><span class="tag gray num">快照 ${(SN(S.rst.snap)||{time:''}).time}</span><button class="ib" onclick="closeModal()">${ic('x')}</button></div>
    <div class="dir-crumb">${ft.crumb}</div>
    <div style="max-height:380px;overflow:auto">${ft.table}</div>
    <div class="mf"><span class="left">已选 <b style="color:var(--blue)">${S.picked.length}</b> 项 ${S.picked.length?`· <a onclick="set({picked:[]})">清空</a>`:''}</span><button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="S.rst.files=[...S.picked];closeModal()">确定</button></div></div>`;
}
function mConfirm(m) {
  const t = T(m.task);
  return `<div class="modal w420">
    <div class="mb" style="padding:26px 24px 8px;text-align:center">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--red-50);color:var(--red);margin:0 auto 14px;display:flex;align-items:center;justify-content:center">${ic('trash',24)}</div>
      <div style="font-size:16px;font-weight:600">删除任务「${t.name}」？</div>
      <div style="font-size:13px;color:var(--t3);margin-top:8px;line-height:1.7">任务配置和计划会被移除。<br>云端已有的 ${R(t.repo).groups[0].snaps.length} 个快照默认保留，仍可在「快照」中还原。</div>
      <label style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:var(--t2)"><span class="cbx"></span>同时删除云端快照（不可恢复）</label>
    </div>
    <div class="mf" style="border:none;justify-content:center;padding-bottom:22px"><button class="btn" style="width:120px" onclick="closeModal()">取消</button><button class="btn danger-fill" style="width:120px" onclick="go({});toast('任务已删除（mock）')">删除</button></div></div>`;
}

/* =====================================================================
   渲染
   ===================================================================== */
function render() {
  renderSide();
  $('main').innerHTML = S.nav === 'tasks' ? renderTasks()
    : S.nav === 'hist' ? renderHist()
    : S.snapView === 'detail' ? renderSnapDetail()
    : S.snapView === 'restore' ? renderRestore() : renderSnapList();
  const M = { wizard:mWizard, dirpick:mDirpick, cloud:mCloud, log:mLog, pick:mPick, confirm:mConfirm };
  $('layer').innerHTML = renderMenu()
    + S.modals.map((m, i) => `<div class="mask ${m.type==='log'?'drawer':''} ${m._new?'anim':''}" style="${i?'background:rgba(15,23,42,.25)':''}" onclick="if(event.target===this)closeModal()">${M[m.type](m)}</div>`).join('')
    + (S.toast ? `<div class="toast"><span class="ok">✓</span>${S.toast}</div>` : '');
  S.modals.forEach(m => delete m._new);
}
document.addEventListener('click', e => { if (S.menu && !e.target.closest('.menu') && !e.target.closest('.ib')) { S.menu = null; render(); } });
render();
</script>
</body>
</html>
