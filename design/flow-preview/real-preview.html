<script>
// 预览辅助：按地址栏 hash 自动切页 / 打开弹窗，方便逐页截图
window.addEventListener("load", () => {
  const h = location.hash.replace("#", "");
  if (!h) return;
  const clickText = (sel, txt) => {
    const el = [...document.querySelectorAll(sel)].find((n) => n.textContent.trim().includes(txt));
    if (el) el.click();
    return !!el;
  };
  setTimeout(() => {
    if (h === "detail" || h === "restore") {
      clickText(".sb-item", "快照");
      setTimeout(() => {
        document.querySelector(".sn-head")?.click();
        setTimeout(() => {
          document.querySelector(".sn-tbl tbody tr")?.click();
          if (h === "restore") {
            setTimeout(() => clickText(".btn.primary", "还原"), 600);
          }
        }, 700);
      }, 600);
    } else if (h === "snap" || h === "snapopen") {
      clickText(".sb-item", "快照");
      if (h === "snapopen") setTimeout(() => { document.querySelector(".sn-head")?.click(); }, 500);
    } else if (h === "hist") {
      clickText(".sb-item", "历史");
    } else if (h === "wizard") {
      clickText(".btn.primary", "创建新任务");
    } else if (h === "picked") {
      clickText(".btn.primary", "创建新任务");
      setTimeout(() => {
        document.querySelector(".cloud-pick-btn")?.click();
        setTimeout(() => { document.querySelectorAll(".cp-item")[1]?.click(); }, 800);
      }, 900);
    } else if (h === "addrepo") {
      clickText(".btn.primary", "创建新任务");
      setTimeout(() => {
        document.querySelector(".cloud-pick-btn")?.click();
        setTimeout(() => { document.querySelector(".cp-item.add")?.click(); }, 800);
      }, 900);
    } else if (h === "pick") {
      clickText(".btn.primary", "创建新任务");
      setTimeout(() => { document.querySelector(".cloud-pick-btn")?.click(); }, 900);
    } else if (h === "logs") {
      document.querySelector(".ttbl tbody tr")?.click();
    }
  }, 700);
});
</script>
